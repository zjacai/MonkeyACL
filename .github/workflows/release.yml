name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: monkeyACL-linux-amd64
            binary: dist/monkeyACL
          - os: windows-latest
            artifact: monkeyACL-windows-amd64.exe
            binary: dist/monkeyACL.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build binary
        run: python -m PyInstaller --onefile --noconfirm --clean --name monkeyACL monkeyACL.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets
        run: |
          mkdir -p dist
          cp artifacts/monkeyACL-linux-amd64/monkeyACL dist/monkeyACL-linux-amd64
          cp artifacts/monkeyACL-windows-amd64.exe/monkeyACL.exe dist/monkeyACL-windows-amd64.exe
          chmod +x dist/monkeyACL-linux-amd64
          sha256sum dist/monkeyACL-linux-amd64 dist/monkeyACL-windows-amd64.exe > dist/SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MonkeyACL ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/monkeyACL-linux-amd64
            dist/monkeyACL-windows-amd64.exe
            dist/SHA256SUMS.txt
          body: |
            ## MonkeyACL ${{ github.ref_name }}

            按端口回收防火墙规则，并修复 Windows 删除规则失败。

            ### 资源文件
            - `monkeyACL-linux-amd64`：Linux x86_64 可执行文件
            - `monkeyACL-windows-amd64.exe`：Windows x86_64 可执行文件
            - `SHA256SUMS.txt`：校验和

            Linux 需 root，Windows 需管理员身份运行。
